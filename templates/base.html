<!doctype html>
<html><head><meta charset="utf-8"><title>DabbaDash Console</title>
<style>
body{font-family:-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#fbf5f2;color:#2a1a14}
header{background:#c2410c;color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;margin-left:16px}
main{max-width:1000px;margin:28px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;padding:20px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #f0e2db;vertical-align:top}
input,select,textarea{padding:7px;margin:4px 0 10px;width:100%;box-sizing:border-box;border:1px solid #dcc8bf;border-radius:4px}
input.qty{width:70px;margin:0}
button{background:#c2410c;color:#fff;border:0;padding:9px 18px;border-radius:4px;cursor:pointer}
.btn-sm{padding:5px 12px;font-size:13px}
.err{color:#b3261e}.muted{color:#7d6a62;font-size:13px}
.tabs a{margin-right:14px}.tabs a.on{font-weight:700}
code{background:#f6ece7;padding:2px 5px;border-radius:3px;word-break:break-all}
</style></head><body>
<header><strong>DabbaDash &middot; Ops Console</strong>
<span>{% if user %}{{ user.name }} ({{ user.role }})<a href="/logout">Logout</a>{% endif %}</span></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
