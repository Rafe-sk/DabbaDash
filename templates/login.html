{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:380px;margin:40px auto">
<h2>Sign in</h2>
{% if request.args.get('msg') %}<p class="muted" style="color:#c2410c;font-weight:600">{{ request.args.get('msg') }}</p>{% endif %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
<label>Username</label><input name="username" autofocus>
<label>Password</label><input name="password" type="password">
<button>Login</button></form>
<p class="muted">New customer? <a href="/register">Register here</a></p>
</div>{% endblock %}
