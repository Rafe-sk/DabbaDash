{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:440px;margin:30px auto;text-align:center">
<h2>Two-Factor Authentication Setup</h2>
<p class="muted">Scan this QR code with your authenticator app (e.g. Google Authenticator):</p>
<div style="max-width:220px;margin:15px auto;">
  {{ qr_svg|safe }}
</div>
<p class="muted" style="font-size:12px;">Manual entry key: <code>{{ secret }}</code></p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" style="margin-top:15px;text-align:left;">
  <label>Enter 6-digit verification code</label>
  <input name="code" type="text" placeholder="123456" pattern="[0-9]{6}" maxlength="6" autofocus required>
  <button style="width:100%;">Verify & Enable MFA</button>
</form>
<p class="muted" style="margin-top:15px;text-align:center;"><a href="/logout">Cancel & Return to Login</a></p>
</div>{% endblock %}
