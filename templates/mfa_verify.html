{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:380px;margin:40px auto;text-align:center">
<h2>Two-Factor Verification</h2>
<p class="muted">Enter the 6-digit code from your authenticator app for <strong>{{ username }}</strong>:</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" style="margin-top:15px;text-align:left;">
  <label>6-digit code</label>
  <input name="code" type="text" placeholder="123456" pattern="[0-9]{6}" maxlength="6" autofocus required>
  <button style="width:100%;">Verify</button>
</form>
<p class="muted" style="margin-top:18px;font-size:13px;">
  <a href="/mfa/enroll?reset=1" style="color:#c2410c;text-decoration:underline;">Haven't set up your app or need to scan the QR code? Click here</a>
</p>
<p class="muted" style="margin-top:12px;text-align:center;"><a href="/logout">Cancel & Return to Login</a></p>
</div>{% endblock %}
